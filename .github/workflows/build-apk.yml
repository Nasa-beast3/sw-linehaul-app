name: Build APK

# Runs automatically on every push, and can also be triggered manually from
# the Actions tab ("Run workflow" button) — no local Android Studio, no
# Android SDK on your own computer needed. The finished .apk shows up under
# this run's "Artifacts" section a few minutes after it starts.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (manual install)
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install required SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SW-LineHaul-app
          path: app/build/outputs/apk/debug/app-debug.apk

      # Artifact downloads from the Actions tab are served from Azure blob
      # storage, which some networks (including the one this project was
      # built from) block. Committing the APK straight into the repo makes
      # it fetchable with a plain `git pull`/download from github.com itself,
      # as a reliable fallback alongside the Artifacts tab above.
      - name: Commit APK to repo (builds/ folder)
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/SW-LineHaul-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/SW-LineHaul-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "ci: update built APK [skip ci]"
            git push
          else
            echo "APK unchanged, nothing to commit"
          fi
