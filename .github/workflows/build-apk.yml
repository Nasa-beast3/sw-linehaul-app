name: Build APK

# Runs automatically on every push, and can also be triggered manually from
# the Actions tab ("Run workflow" button) — no local Android Studio, no
# Android SDK on your own computer needed. The finished .apk shows up under
# this run's "Artifacts" section a few minutes after it starts.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform + build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SW-LineHaul-app
          path: app/build/outputs/apk/debug/app-debug.apk
